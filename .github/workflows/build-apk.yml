

name: Build Android APK

on:
  push:
    branches:
      - main
      - refactor/tanstack-query
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Tests
        run: |
          npm run lint
          npm test

      - name: Verify PWA output
        run: |
          npm run build
          test -s dist/sw.js

      - name: Build Web App (Android mode)
        run: npm run build:android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore fixed Android debug signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MIZAN_DEBUG_KEYSTORE_B64: ${{ secrets.MIZAN_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$MIZAN_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Missing MIZAN_DEBUG_KEYSTORE_B64"
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$MIZAN_DEBUG_KEYSTORE_B64" \
            | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build APK (Debug)
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify packaged Android assets
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$apk"
          unzip -p "$apk" assets/public/index.html > /tmp/mizan-apk-index.html
          test -s /tmp/mizan-apk-index.html

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mizan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

