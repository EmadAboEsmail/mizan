<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <meta name="theme-color" content="#FAF6F0" />
    <meta
      name="description"
      content="مِيزان — توازن يومك ومالك: ذِكر للسبحة والأوراد، والميزانية لإدارة الدخل والمصروف بدون إنترنت"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ميزان" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />

    <title>مِيزان — ذِكر والميزانية</title>

    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var isAmoled = t === 'amoled'
          var isDark =
            isAmoled ||
            t === 'dark' ||
            (!t &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          document.documentElement.dataset.theme = isAmoled
            ? 'amoled'
            : isDark
              ? 'dark'
              : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute(
              'content',
              isAmoled ? '#000000' : isDark ? '#131210' : '#FAF6F0'
            )
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <script>
      if (
        document.documentElement.dataset.theme === 'dark' ||
        document.documentElement.dataset.theme === 'amoled'
      ) {
        document.body.classList.add('dark')
      }
      if (document.documentElement.dataset.theme === 'amoled') {
        document.body.classList.add('amoled')
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
