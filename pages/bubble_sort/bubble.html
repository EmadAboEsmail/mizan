<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محاكاة مرئية لـ Bubble Sort</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 0%, #1e293b, #0b1220 70%);
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    color: #e2e8f0;
    padding: 20px;
  }

  .app { width: min(900px, 100%); }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #60a5fa, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    text-align: center;
    margin: 0 0 22px;
    color: #94a3b8;
    font-size: .9rem;
  }

  /* ===== مسرح العرض ===== */
  .stage {
    position: relative;
    height: 320px;
    border-radius: 16px;
    background:
      linear-gradient(#0f172a, #0f172a) padding-box,
      linear-gradient(135deg, #334155, #1e293b) border-box;
    border: 1px solid transparent;
    box-shadow: inset 0 0 60px rgba(0,0,0,.5);
    overflow: hidden;
  }

  /* خطوط خلفية خفيفة */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px);
    background-size: 100% 25%;
  }

  .bars { position: absolute; inset: 0; }

  /* ===== العمود ===== */
  .bar {
    position: absolute;
    bottom: 0;
    border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, #60a5fa, #2563eb);
    box-shadow: 0 -2px 12px rgba(37,99,235,.35);
    transition: left .22s cubic-bezier(.4,0,.2,1),
                background .2s ease,
                box-shadow .2s ease;
  }

  .bar .value {
    position: absolute;
    bottom: 7px;
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }

  /* الحالات اللونية */
  .bar.compare {
    background: linear-gradient(180deg, #fcd34d, #f59e0b);
    box-shadow: 0 -2px 18px rgba(245,158,11,.6);
  }
  .bar.noswap {
    background: linear-gradient(180deg, #a5b4fc, #6366f1);
    box-shadow: 0 -2px 14px rgba(99,102,241,.5);
  }
  .bar.swap {
    background: linear-gradient(180deg, #fb7185, #e11d48);
    box-shadow: 0 -2px 22px rgba(225,29,72,.75);
  }
  .bar.sorted {
    background: linear-gradient(180deg, #6ee7b7, #059669);
    box-shadow: 0 -2px 16px rgba(5,150,105,.5);
  }

  /* ===== شريط الحالة ===== */
  .status {
    margin: 14px 0;
    padding: 12px 16px;
    border-radius: 12px;
    background: #0f172a;
    border: 1px solid #1e293b;
    text-align: center;
    font-size: .95rem;
    font-weight: 600;
    color: #cbd5e1;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .2s, color .2s;
  }
  .status.swap    { border-color: #e11d48; color: #fda4af; }
  .status.noswap  { border-color: #6366f1; color: #a5b4fc; }
  .status.compare { border-color: #f59e0b; color: #fcd34d; }
  .status.pass    { border-color: #059669; color: #6ee7b7; }
  .status.done    { border-color: #059669; color: #6ee7b7; background: #052e21; }

  /* ===== الأزرار ===== */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }

  button {
    font-family: inherit;
    font-size: .9rem;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    cursor: pointer;
    transition: .15s;
  }
  button:hover:not(:disabled) {
    background: #334155;
    transform: translateY(-1px);
  }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #playBtn {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-color: #3b82f6;
  }
  #playBtn:hover:not(:disabled) { background: linear-gradient(135deg, #3b82f6, #2563eb); }

  .speed {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .85rem;
    color: #94a3b8;
    padding: 0 8px;
  }
  input[type=range] { accent-color: #3b82f6; width: 110px; }

  /* ===== دليل الألوان ===== */
  .legend {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    font-size: .8rem;
    color: #94a3b8;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot {
    width: 12px; height: 12px;
    border-radius: 4px;
    display: inline-block;
  }
  .dot.default { background: linear-gradient(180deg,#60a5fa,#2563eb); }
  .dot.compare { background: linear-gradient(180deg,#fcd34d,#f59e0b); }
  .dot.swap    { background: linear-gradient(180deg,#fb7185,#e11d48); }
  .dot.sorted  { background: linear-gradient(180deg,#6ee7b7,#059669); }

  @media (max-width: 560px) {
    .stage { height: 240px; }
    .bar .value { font-size: 11px; bottom: 4px; }
    button { padding: 8px 12px; font-size: .8rem; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>محاكاة Bubble Sort</h1>
  <p class="sub">العناصر الكبيرة "تطفو" نحو النهاية في كل دورة</p>

  <div class="stage">
    <div class="bars" id="bars"></div>
  </div>

  <div class="status" id="status">اضغط «تشغيل» أو «خطوة» للبدء</div>

  <div class="controls">
    <button id="playBtn">▶ تشغيل</button>
    <button id="stepBtn">خطوة ▸</button>
    <button id="resetBtn">↺ إعادة</button>
    <button id="newBtn">🎲 مصفوفة جديدة</button>
    <label class="speed">السرعة
      <input type="range" id="speed" min="1" max="10" value="5">
    </label>
  </div>

  <div class="legend">
    <span><i class="dot default"></i> عادي</span>
    <span><i class="dot compare"></i> مقارنة</span>
    <span><i class="dot swap"></i> تبديل</span>
    <span><i class="dot sorted"></i> في مكانه الصحيح</span>
  </div>
</div>

<script>
/* ============================================================
   1) مُولِّد الخطوات (Generator)
   يُنتج وصفًا لكل حدث: مقارنة / تبديل / لا تبديل / نهاية دورة
   ============================================================ */
function* bubbleSortSteps(arr) {
  const a = [...arr];
  const n = a.length;

  for (let i = 0; i < n - 1; i++) {
    let swapped = false;

    for (let j = 0; j < n - 1 - i; j++) {
      // خطوة: مقارنة العنصرين المتجاورين
      yield {
        type: 'compare',
        indices: [j, j + 1],
        sortedCount: i,
        msg: `مقارنة: ${a[j]} و ${a[j + 1]}`
      };

      if (a[j] > a[j + 1]) {
        const x = a[j], y = a[j + 1];
        a[j] = y; a[j + 1] = x;
        swapped = true;

        yield {
          type: 'swap',
          indices: [j, j + 1],
          sortedCount: i,
          msg: `${x} > ${y} ← تبديل`
        };
      } else {
        yield {
          type: 'noswap',
          indices: [j, j + 1],
          sortedCount: i,
          msg: `${a[j]} ≤ ${a[j + 1]} ← لا تبديل`
        };
      }
    }

    // خطوة: انتهاء دورة كاملة → عنصر استقر في مكانه
    yield {
      type: 'pass',
      indices: null,
      sortedCount: i + 1,
      msg: `✔ انتهت الدورة ${i + 1}: العنصر ${a[n - 1 - i]} استقر في مكانه`
    };

    // تحسين: لا تبديلات ⇒ مرتبة بالفعل
    if (!swapped) {
      yield {
        type: 'pass',
        indices: null,
        sortedCount: n,
        msg: 'لا توجد أي تبديلات في هذه الدورة ← المصفوفة مرتبة مسبقًا'
      };
      return;
    }
  }
}

/* ============================================================
   2) حالة التطبيق
   ============================================================ */
const barsEl   = document.getElementById('bars');
const statusEl = document.getElementById('status');
const playBtn  = document.getElementById('playBtn');
const stepBtn  = document.getElementById('stepBtn');
const resetBtn = document.getElementById('resetBtn');
const newBtn   = document.getElementById('newBtn');
const speedEl  = document.getElementById('speed');

let els = [];          // عناصر الأعمدة بترتيبها المنطقي الحالي
let iterator = null;   // مولد الخطوات
let playing = false;
let timerId = null;
let baseArray = [];    // المصفوفة الأصلية للإعادة

/* ============================================================
   3) بناء الأعمدة
   ============================================================ */
function buildBars(arr) {
  barsEl.innerHTML = '';
  els = [];

  const n = arr.length;
  const maxV = Math.max(...arr);
  const stepPct = 100 / n;

  arr.forEach((v, i) => {
    const el = document.createElement('div');
    el.className = 'bar';
    el.style.width  = `calc(${stepPct}% - 8px)`;
    el.style.left   = `calc(${i * stepPct}% + 4px)`;
    el.style.height = (v / maxV * 100) + '%';
    el.innerHTML = `<span class="value">${v}</span>`;
    barsEl.appendChild(el);
    els.push(el);
  });
}

/* تحديث موضع عمود بعد التبديل */
function updateLeft(i) {
  const stepPct = 100 / els.length;
  els[i].style.left = `calc(${i * stepPct}% + 4px)`;
}

/* ============================================================
   4) تطبيق خطوة على الشاشة
   ============================================================ */
function applyStep(s) {
  // (أ) إن كانت الخطوة تبديلًا: بدّل الأعمدة فعليًا في الـ DOM
  if (s.type === 'swap') {
    const [a, b] = s.indices;
    [els[a], els[b]] = [els[b], els[a]];
    updateLeft(a);
    updateLeft(b);
  }

  // (ب) تلوين الأعمدة
  const n = els.length;
  const sortedFrom = n - (s.sortedCount || 0);

  els.forEach((el, i) => {
    el.classList.remove('compare', 'swap', 'noswap');
    el.classList.toggle('sorted', i >= sortedFrom);
  });

  if (s.indices) {
    const cls = s.type === 'compare' ? 'compare'
              : s.type === 'swap'    ? 'swap'
              : 'noswap';
    els[s.indices[0]].classList.add(cls);
    els[s.indices[1]].classList.add(cls);
  }

  // (ج) نص الحالة
  statusEl.textContent = s.msg || '';
  statusEl.className = 'status ' + s.type;
}

/* ============================================================
   5) التحكم في التشغيل
   ============================================================ */
function delay() {
  return 1400 - Number(speedEl.value) * 120; // 1280ms … 200ms
}

function stepOnce() {
  if (!iterator) return true;

  const { value, done } = iterator.next();

  if (done) {
    // إنهاء: تلوين كل الأعمدة بالأخضر
    els.forEach(el => {
      el.classList.remove('compare', 'swap', 'noswap');
      el.classList.add('sorted');
    });
    statusEl.textContent = '🎉 اكتمل الترتيب!';
    statusEl.className = 'status done';
    iterator = null;
    return true;
  }

  applyStep(value);
  return false;
}

function tick() {
  if (!playing) return;

  const finished = stepOnce();

  if (finished) {
    stop();
    return;
  }
  timerId = setTimeout(tick, delay());
}

function play() {
  if (playing) return;
  if (!iterator) reset();          // لو انتهى سابقًا، أعد من البداية
  playing = true;
  playBtn.textContent = '⏸ إيقاف';
  tick();
}

function stop() {
  playing = false;
  clearTimeout(timerId);
  playBtn.textContent = '▶ تشغيل';
}

/* ============================================================
   6) الإعداد وإعادة الضبط
   ============================================================ */
function randomArray(n = 8) {
  return Array.from({ length: n }, () => Math.floor(Math.random() * 53) + 8);
}

function reset(newArray = false) {
  stop();
  if (newArray || baseArray.length === 0) baseArray = randomArray();

  buildBars(baseArray);
  iterator = bubbleSortSteps(baseArray);

  statusEl.textContent = 'اضغط «تشغيل» أو «خطوة» للبدء';
  statusEl.className = 'status';
}

/* ============================================================
   7) ربط الأحداث
   ============================================================ */
playBtn.addEventListener('click', () => playing ? stop() : play());

stepBtn.addEventListener('click', () => {
  stop();
  stepOnce();
});

resetBtn.addEventListener('click', () => reset(false));
newBtn.addEventListener('click',   () => reset(true));

speedEl.addEventListener('input', () => {
  if (playing) { clearTimeout(timerId); timerId = setTimeout(tick, delay()); }
});

// البداية
reset(true);
</script>
</body>
</html>
