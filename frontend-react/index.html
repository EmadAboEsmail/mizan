<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══ Viewport ═══ -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes"
    />

    <!-- ═══ Favicon ═══ -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- ═══ Basic Meta ═══ -->
    <meta name="theme-color" content="#059669" />

      name="description"

    />

    <!-- ═══ PWA Meta (iOS) ═══ -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="مساحتي" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ═══ PWA Meta (Android — theme color in standalone) ═══ -->

      content="#000000"
      media="(display-mode: standalone)"
    />

    <!-- ═══ Apple Icons ═══ -->
    <link
      rel="apple-touch-icon"
      href="/icons/apple-touch-icon.png"
      sizes="180x180"
    />

    <!-- ═══ Fonts ═══ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap"
