<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#317557"/>
      <stop offset="52%" stop-color="#21553E"/>
      <stop offset="100%" stop-color="#133526"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#E5A552" stop-opacity="0.19"/>
      <stop offset="100%" stop-color="#E5A552" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="ivoryGrad" gradientUnits="userSpaceOnUse" x1="256" y1="140" x2="256" y2="414">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="65%" stop-color="#F7F1E6"/>
      <stop offset="100%" stop-color="#EAE0D0"/>
    </linearGradient>
    <linearGradient id="goldGrad" gradientUnits="userSpaceOnUse" x1="224" y1="86" x2="288" y2="206">
      <stop offset="0%" stop-color="#F7CC7F"/>
      <stop offset="55%" stop-color="#E5A552"/>
      <stop offset="100%" stop-color="#C6832D"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#091E15" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#warmGlow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rimStroke)" stroke-width="6"/>
  <g transform="translate(256 259) scale(0.86) translate(-256 -256)" filter="url(#softShadow)">
    <!-- رأس الميزان الذهبي -->
    <path d="M256 86 C262.5 105 271 113.5 288 120 C271 126.5 262.5 135 256 154 C249.5 135 241 126.5 224 120 C241 113.5 249.5 105 256 86 Z"
          fill="url(#goldGrad)"/>
    <!-- ذراع الميزان المتوازن -->
    <path d="M116 186 Q186 170 256 182 Q326 170 396 186"
          fill="none" stroke="url(#ivoryGrad)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="116" cy="186" r="13.5" fill="url(#ivoryGrad)"/>
    <circle cx="396" cy="186" r="13.5" fill="url(#ivoryGrad)"/>
    <!-- العمود الأوسط -->
    <rect x="245.0" y="200" width="22" height="170" rx="11.0" fill="url(#ivoryGrad)"/>
    <!-- الكفة اليسرى -->
    <path d="M116 194 L76 291 M116 194 L156 291"
          fill="none" stroke="url(#ivoryGrad)" stroke-width="11.5" stroke-linecap="round"/>
    <path d="M62 287 H170 C172.5 287 174 289 173.6 291.5 C169.5 323 146 343 116 343 C86 343 62.5 323 58.4 291.5 C58 289 59.5 287 62 287 Z"
          fill="url(#ivoryGrad)"/>
    <!-- الكفة اليمنى -->
    <path d="M396 194 L356 291 M396 194 L436 291"
          fill="none" stroke="url(#ivoryGrad)" stroke-width="11.5" stroke-linecap="round"/>
    <path d="M342 287 H450 C452.5 287 454 289 453.6 291.5 C449.5 323 426 343 396 343 C366 343 342.5 323 338.4 291.5 C338 289 339.5 287 342 287 Z"
          fill="url(#ivoryGrad)"/>
    <!-- حلقة الارتكاز -->
    <circle cx="256" cy="184" r="25.5" fill="url(#ivoryGrad)"/>
    <circle cx="256" cy="184" r="11.5" fill="url(#goldGrad)"/>
    <!-- القاعدة المتدرجة -->
    <rect x="204" y="361" width="104" height="18" rx="9" fill="url(#ivoryGrad)"/>
    <rect x="170" y="386" width="172" height="23" rx="11.5" fill="url(#ivoryGrad)"/>
